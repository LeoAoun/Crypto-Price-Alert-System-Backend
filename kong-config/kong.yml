_format_version: "3.0"
_transform: true

services:
  - name: identity-service
    url: http://host.docker.internal:8081
    routes:
      - name: auth-route
        strip_path: false
        paths:
          - /api/v1/auth

      - name: users-route
        strip_path: false
        paths:
          - /api/v1/users
        plugins:
          - name: jwt
            config:
              key_claim_name: iss

  - name: user-preference-service
    url: http://host.docker.internal:8082
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
    routes:
      - name: preferences-route
        strip_path: false
        paths:
          - /api/v1/user-preferences

  - name: price-fetcher-service
    url: http://host.docker.internal:8083
    plugins:
      - name: jwt
        config:
          key_claim_name: iss
    routes:
      - name: price-route
        strip_path: false
        paths:
          - /api/v1/prices

consumers:
  - username: cpas_frontend
    jwt_secrets:
      - key: "identity-service"
        algorithm: RS256
        secret: "placeholder-secret-not-used-for-rs256"
        rsa_public_key: |-

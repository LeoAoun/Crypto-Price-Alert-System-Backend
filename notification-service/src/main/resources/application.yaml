server:
  port: 8085

spring:
  application:
    name: notification-service
  
  kafka:
    bootstrap-servers:
    - ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        "[spring.deserializer.value.delegate.class]": org.apache.kafka.common.serialization.ByteArrayDeserializer
        "[spring.json.use.type.headers]": "false"
        "[spring.json.trusted.packages]": "*"

# Custom topics
app:
  topics:
    prices: crypto-prices
    alerts: price-alerts

callmebot:
  whatsapp:
    url: "${WHATSAPP_URL:https://api.callmebot.com/whatsapp.php}"
    phone: "${WHATSAPP_PHONE:+5511940325586}" 
    apikey: "${WHATSAPP_APIKEY:2071347}"